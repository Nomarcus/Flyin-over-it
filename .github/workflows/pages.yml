# Publishes dist/ to GitHub Pages so the game can be played on a phone over HTTPS.
# HTTPS matters: iOS only exposes the gyro to a secure origin, so LAN testing over
# plain http:// gives you touch controls but no motion sensor.
name: Deploy game to Pages

on:
  push:
    branches:
      - main
      - claude/game-camera-hud-feedback-dvjumv
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # No enablement here: the workflow token cannot create a Pages site ("Resource not
      # accessible by integration"). Pages has to be switched on once in
      # Settings -> Pages with Source set to GitHub Actions; this job then publishes to it.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
